name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q lora_caption_studio tests bootstrap.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify application imports without provider credentials
        run: >-
          python -c
          "import lora_caption_studio.application, lora_caption_studio.providers;
          print('application import ok')"
