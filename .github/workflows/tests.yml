name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q lora_caption_studio tests bootstrap.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify application can start without Codex or API credentials
        shell: python
        run: |
          import subprocess, sys, time, urllib.request
          process = subprocess.Popen(
              [sys.executable, "-m", "lora_caption_studio", "--no-open", "--port", "0"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          try:
              deadline = time.time() + 15
              url = None
              while time.time() < deadline:
                  line = process.stdout.readline()
                  if "http://" in line:
                      url = line[line.index("http://"):].strip()
                      break
              if not url:
                  raise RuntimeError("server did not report its URL")
              with urllib.request.urlopen(url + "api/data", timeout=5) as response:
                  assert response.status == 200
          finally:
              process.terminate()
              process.wait(timeout=10)
