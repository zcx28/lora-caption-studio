[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-caption-studio"
version = "1.0.0"
description = "A local, cross-platform studio for AI-assisted LoRA image captioning and review."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "Pillow>=10.3,<13",
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
lora-caption-studio = "lora_caption_studio.application:main"

[tool.setuptools.package-data]
lora_caption_studio = ["ui/*.html", "ui/*.css", "ui/*.js"]
